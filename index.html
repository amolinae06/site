9,28"}},{"content":"\n<p data-lines=\"28,29\"><strong>Estudios inmunol&#xf3;gicos</strong></p>","children":[{"content":"Complemento disminuido.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"IgG disminuida.","children":[],"payload":{"tag":"li","lines":"30,32"}}],"payload":{"tag":"li","lines":"28,32"}},{"content":"\n<p data-lines=\"32,33\"><strong>Examen general de orina</strong></p>","children":[{"content":"Sangre: ++.","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"Prote&#xed;nas: +.","children":[],"payload":{"tag":"li","lines":"34,36"}}],"payload":{"tag":"li","lines":"32,36"}},{"content":"\n<p data-lines=\"36,37\"><strong>Estudio microbiol&#xf3;gico</strong></p>","children":[{"content":"Hemocultivo negativo.","children":[],"payload":{"tag":"li","lines":"37,39"}}],"payload":{"tag":"li","lines":"36,39"}}],"payload":{"tag":"h2","lines":"12,13"}},{"content":"<strong>P1. &#xbf;CU&#xc1;L ES EL PROBLEMA PRINCIPAL?</strong>","children":[{"content":"\n<p data-lines=\"41,42\"><strong>RESPUESTA: sangrado con anemia grave y trombocitopenia marcada</strong></p>","children":[{"content":"Hemoglobina de <strong>6 g/dL</strong>.","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"Plaquetas de <strong>35 000</strong>.","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"Ambos hallazgos requieren explicar <strong>qu&#xe9; mecanismo produjo la alteraci&#xf3;n hematol&#xf3;gica</strong>.","children":[],"payload":{"tag":"li","lines":"44,46"}}],"payload":{"tag":"li","lines":"41,46"}},{"content":"\n<p data-lines=\"46,47\"><strong>Componente 1: disminuci&#xf3;n de hemoglobina</strong></p>","children":[{"content":"<strong>Persona sana</strong>","children":[{"content":"La m&#xe9;dula &#xf3;sea produce eritrocitos funcionales.","children":[],"payload":{"tag":"li","lines":"48,49"}},{"content":"Los eritrocitos contienen hemoglobina.","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"La hemoglobina transporta ox&#xed;geno a los tejidos.","children":[],"payload":{"tag":"li","lines":"50,51"}}],"payload":{"tag":"li","lines":"47,51"}},{"content":"<strong>Paciente</strong>","children":[{"content":"Hemoglobina de 6 g/dL.","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"Menor capacidad de transporte de ox&#xed;geno.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"La causa puede incluir p&#xe9;rdida sangu&#xed;nea, destrucci&#xf3;n eritrocitaria o producci&#xf3;n insuficiente.","children":[],"payload":{"tag":"li","lines":"54,55"}},{"content":"<strong>No se ha demostrado todav&#xed;a cu&#xe1;l predomina</strong>.","children":[],"payload":{"tag":"li","lines":"55,57"}}],"payload":{"tag":"li","lines":"51,57"}}],"payload":{"tag":"li","lines":"46,57"}},{"content":"\n<p data-lines=\"57,58\"><strong>Componente 2: disminuci&#xf3;n de plaquetas</strong></p>","children":[{"content":"<strong>Persona sana</strong>","children":[{"content":"Los megacariocitos producen plaquetas.","children":[],"payload":{"tag":"li","lines":"59,60"}},{"content":"Ante una lesi&#xf3;n vascular, las plaquetas se adhieren y activan.","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"Se forma el tap&#xf3;n hemost&#xe1;tico primario.","children":[],"payload":{"tag":"li","lines":"61,62"}}],"payload":{"tag":"li","lines":"58,62"}},{"content":"<strong>Paciente</strong>","children":[{"content":"Solo se reportan 35 000 plaquetas.","children":[],"payload":{"tag":"li","lines":"63,64"}},{"content":"Existe menor disponibilidad plaquetaria para la hemostasia.","children":[],"payload":{"tag":"li","lines":"64,65"}},{"content":"Puede aumentar la susceptibilidad al sangrado.","children":[],"payload":{"tag":"li","lines":"65,67"}}],"payload":{"tag":"li","lines":"62,67"}}],"payload":{"tag":"li","lines":"57,67"}}],"payload":{"tag":"h2","lines":"39,40"}},{"content":"<strong>P2. &#xbf;CU&#xc1;L ES EL PROBLEMA SECUNDARIO?</strong>","children":[{"content":"\n<p data-lines=\"69,70\"><strong>RESPUESTA: trombocitopenia marcada que necesita explicaci&#xf3;n etiol&#xf3;gica</strong></p>","children":[{"content":"Plaquetas: 35 000.","children":[],"payload":{"tag":"li","lines":"70,71"}},{"content":"La disminuci&#xf3;n puede originarse por <strong>tres mecanismos principales</strong>.","children":[],"payload":{"tag":"li","lines":"71,73"}}],"payload":{"tag":"li","lines":"69,73"}},{"content":"\n<p data-lines=\"73,74\"><strong>Mecanismo A: destrucci&#xf3;n perif&#xe9;rica</strong></p>","children":[{"content":"El sistema inmunol&#xf3;gico reconoce anormalmente plaquetas.","children":[],"payload":{"tag":"li","lines":"74,75"}},{"content":"Los macr&#xf3;fagos pueden eliminarlas.","children":[],"payload":{"tag":"li","lines":"75,76"}},{"content":"Disminuye su cantidad circulante.","children":[],"payload":{"tag":"li","lines":"76,78"}}],"payload":{"tag":"li","lines":"73,78"}},{"content":"\n<p data-lines=\"78,79\"><strong>Mecanismo B: producci&#xf3;n medular insuficiente</strong></p>","children":[{"content":"La m&#xe9;dula &#xf3;sea produce menos plaquetas funcionales.","children":[],"payload":{"tag":"li","lines":"79,80"}},{"content":"Puede coexistir con producci&#xf3;n eritrocitaria alterada.","children":[],"payload":{"tag":"li","lines":"80,82"}}],"payload":{"tag":"li","lines":"78,82"}},{"content":"\n<p data-lines=\"82,83\"><strong>Mecanismo C: consumo microvascular</strong></p>","children":[{"content":"Se forman microtrombos.","children":[],"payload":{"tag":"li","lines":"83,84"}},{"content":"Las plaquetas se incorporan a ellos.","children":[],"payload":{"tag":"li","lines":"84,85"}},{"content":"Disminuye su n&#xfa;mero en circulaci&#xf3;n.","children":[],"payload":{"tag":"li","lines":"85,87"}}],"payload":{"tag":"li","lines":"82,87"}}],"payload":{"tag":"h2","lines":"67,68"}},{"content":"<strong>P3 TRES DIAGNOSTICOS DIFERENCIALES</strong>","children":[{"content":"<strong>HIP&#xd3;TESIS 1. LUPUS ERITEMATOSO SIST&#xc9;MICO (LES)</strong>","children":[{"content":"<strong>&#xbf;POR QU&#xc9;?</strong>","children":[{"content":"\n<p data-lines=\"93,94\"><strong>Dato del caso: plaquetas de 35 000</strong></p>","children":[{"content":"Existe trombocitopenia marcada.","children":[],"payload":{"tag":"li","lines":"94,95"}},{"content":"El LES puede asociarse con trombocitopenia inmunol&#xf3;gica.","children":[],"payload":{"tag":"li","lines":"95,96"}},{"content":"Pero no sabemos si las plaquetas se destruyen por autoanticuerpos.","children":[],"payload":{"tag":"li","lines":"96,98"}}],"payload":{"tag":"li","lines":"93,98"}},{"content":"\n<p data-lines=\"98,99\"><strong>Dato del caso: hemoglobina de 6 g/dL</strong></p>","children":[{"content":"Existe anemia grave.","children":[],"payload":{"tag":"li","lines":"99,100"}},{"content":"En el LES puede presentarse anemia hemol&#xed;tica autoinmune.","children":[],"payload":{"tag":"li","lines":"100,101"}},{"content":"Pero la anemia tambi&#xe9;n puede deberse al sangrado o a producci&#xf3;n insuficiente.","children":[],"payload":{"tag":"li","lines":"101,102"}},{"content":"No hay evidencia de hem&#xf3;lisis confirmada.","children":[],"payload":{"tag":"li","lines":"102,104"}}],"payload":{"tag":"li","lines":"98,104"}},{"content":"\n<p data-lines=\"104,105\"><strong>Dato del caso: complemento disminuido</strong></p>","children":[{"content":"Algunas manifestaciones del LES se relacionan con activaci&#xf3;n y consumo del complemento.","children":[],"payload":{"tag":"li","lines":"105,106"}},{"content":"Este hallazgo puede orientar hacia procesos inmunol&#xf3;gicos.","children":[],"payload":{"tag":"li","lines":"106,107"}},{"content":"El complemento bajo no es espec&#xed;fico del LES.","children":[],"payload":{"tag":"li","lines":"107,109"}}],"payload":{"tag":"li","lines":"104,109"}},{"content":"\n<p data-lines=\"109,110\"><strong>Dato del caso: sangre ++ y prote&#xed;nas + en orina</strong></p>","children":[{"content":"Podr&#xed;an motivar la investigaci&#xf3;n de una alteraci&#xf3;n glomerular.","children":[],"payload":{"tag":"li","lines":"110,111"}},{"content":"El LES puede producir nefritis mediada por mecanismos inmunol&#xf3;gicos.","children":[],"payload":{"tag":"li","lines":"111,113"}}],"payload":{"tag":"li","lines":"109,113"}}],"payload":{"tag":"h4","lines":"91,92"}},{"content":"<strong>&#xbf;QU&#xc9; PRUEBAS SOLICITAR&#xcd;A?</strong>","children":[{"content":"\n<p data-lines=\"115,116\"><strong>Para investigar LES</strong></p>","children":[{"content":"ANA por inmunofluorescencia.","children":[{"content":"Investigar presencia de autoanticuerpos antinucleares.","children":[],"payload":{"tag":"li","lines":"117,118"}}],"payload":{"tag":"li","lines":"116,118"}},{"content":"Anti-ADN de doble cadena.","children":[{"content":"Buscar autoanticuerpos asociados con LES.","children":[],"payload":{"tag":"li","lines":"119,120"}}],"payload":{"tag":"li","lines":"118,120"}},{"content":"Anti-Sm.","children":[{"content":"Investigar un autoanticuerpo relativamente espec&#xed;fico de LES.","children":[],"payload":{"tag":"li","lines":"121,122"}}],"payload":{"tag":"li","lines":"120,122"}},{"content":"C3 y C4.","children":[{"content":"Caracterizar la disminuci&#xf3;n del complemento.","children":[],"payload":{"tag":"li","lines":"123,125"}}],"payload":{"tag":"li","lines":"122,125"}}],"payload":{"tag":"li","lines":"115,125"}},{"content":"\n<p data-lines=\"125,126\"><strong>Para investigar citopenias inmunol&#xf3;gicas</strong></p>","children":[{"content":"Coombs directo.","children":[{"content":"Buscar anticuerpos o complemento unidos a eritrocitos.","children":[],"payload":{"tag":"li","lines":"127,128"}}],"payload":{"tag":"li","lines":"126,128"}},{"content":"Reticulocitos.","children":[{"content":"Evaluar respuesta eritropoy&#xe9;tica.","children":[],"payload":{"tag":"li","lines":"129,130"}}],"payload":{"tag":"li","lines":"128,130"}},{"content":"LDH, haptoglobina y bilirrubina indirecta.","children":[{"content":"Investigar hem&#xf3;lisis.","children":[],"payload":{"tag":"li","lines":"131,132"}}],"payload":{"tag":"li","lines":"130,132"}},{"content":"Frotis perif&#xe9;rico.","children":[{"content":"Examinar morfolog&#xed;a eritrocitaria y plaquetaria.","children":[],"payload":{"tag":"li","lines":"133,135"}}],"payload":{"tag":"li","lines":"132,135"}}],"payload":{"tag":"li","lines":"125,135"}},{"content":"\n<p data-lines=\"135,136\"><strong>Para investigar posible afectaci&#xf3;n renal</strong></p>","children":[{"content":"Creatinina y filtraci&#xf3;n glomerular estimada.","children":[{"content":"Evaluar funci&#xf3;n renal.","children":[],"payload":{"tag":"li","lines":"137,138"}}],"payload":{"tag":"li","lines":"136,138"}},{"content":"Sedimento urinario microsc&#xf3;pico.","children":[{"content":"Buscar eritrocitos dism&#xf3;rficos o cilindros.","children":[],"payload":{"tag":"li","lines":"139,140"}}],"payload":{"tag":"li","lines":"138,140"}},{"content":"Cuantificaci&#xf3;n de proteinuria.","children":[{"content":"Determinar magnitud de la p&#xe9;rdida de prote&#xed;nas.","children":[],"payload":{"tag":"li","lines":"141,142"}}],"payload":{"tag":"li","lines":"140,142"}},{"content":"Biopsia renal si est&#xe1; cl&#xed;nicamente indicada.","children":[{"content":"Caracterizar la lesi&#xf3;n renal.","children":[],"payload":{"tag":"li","lines":"143,145"}}],"payload":{"tag":"li","lines":"142,145"}}],"payload":{"tag":"li","lines":"135,145"}},{"content":"\n<p data-lines=\"145,146\"><strong>Para caracterizar la IgG baja</strong></p>","children":[{"content":"IgG, IgA e IgM cuantitativas.","children":[],"payload":{"tag":"li","lines":"146,147"}},{"content":"Investigar posibles causas secundarias de hipogammaglobulinemia.","children":[],"payload":{"tag":"li","lines":"147,149"}}],"payload":{"tag":"li","lines":"145,149"}}],"payload":{"tag":"h4","lines":"113,114"}},{"content":"<strong>&#xbf;QU&#xc9; RESULTADOS LO APOYAR&#xcd;AN O DEBILITAR&#xcd;AN?</strong>","children":[{"content":"\n<p data-lines=\"151,152\"><strong>APOYAR&#xcd;AN LA HIP&#xd3;TESIS</strong></p>","children":[{"content":"ANA positivo en un contexto cl&#xed;nico compatible.","children":[],"payload":{"tag":"li","lines":"152,153"}},{"content":"Anti-ADN de doble cadena o anti-Sm positivos.","children":[],"payload":{"tag":"li","lines":"153,154"}},{"content":"C3 y/o C4 disminuidos, en un patr&#xf3;n compatible.","children":[],"payload":{"tag":"li","lines":"154,155"}},{"content":"Evidencia de hem&#xf3;lisis junto con Coombs directo compatible.","children":[],"payload":{"tag":"li","lines":"155,156"}},{"content":"Sedimento urinario con caracter&#xed;sticas glomerulares.","children":[],"payload":{"tag":"li","lines":"156,157"}},{"content":"Hallazgos histol&#xf3;gicos compatibles, si se realiza biopsia renal.","children":[],"payload":{"tag":"li","lines":"157,159"}}],"payload":{"tag":"li","lines":"151,159"}},{"content":"\n<p data-lines=\"159,160\"><strong>LA DEBILITAR&#xcd;AN</strong></p>","children":[{"content":"Ausencia de evidencia inmunol&#xf3;gica compatible.","children":[],"payload":{"tag":"li","lines":"160,161"}},{"content":"Falta de datos de hem&#xf3;lisis inmunol&#xf3;gica.","children":[],"payload":{"tag":"li","lines":"161,162"}},{"content":"Ausencia de evidencia de da&#xf1;o glomerular.","children":[],"payload":{"tag":"li","lines":"162,163"}},{"content":"Identificaci&#xf3;n de otra causa que explique mejor las citopenias.","children":[],"payload":{"tag":"li","lines":"163,165"}}],"payload":{"tag":"li","lines":"159,165"}},{"content":"\n<p data-lines=\"165,166\"><strong>CONCLUSI&#xd3;N</strong></p>","children":[{"content":"<strong>El LES es una hip&#xf3;tesis posible, pero no confirmada.</strong>","children":[],"payload":{"tag":"li","lines":"166,167"}},{"content":"Es necesario demostrar autoinmunidad y caracterizar el mecanismo de las citopenias y las alteraciones urinarias.","children":[],"payload":{"tag":"li","lines":"167,169"}}],"payload":{"tag":"li","lines":"165,169"}}],"payload":{"tag":"h4","lines":"149,150"}}],"payload":{"tag":"h3","lines":"89,90"}},{"content":"<strong>HIP&#xd3;TESIS 2. S&#xcd;NDROME MIELODISPL&#xc1;SICO (SMD)</strong>","children":[{"content":"<strong>&#xbf;POR QU&#xc9;?</strong>","children":[{"content":"\n<p data-lines=\"175,176\"><strong>Dato del caso: hemoglobina de 6 g/dL</strong></p>","children":[{"content":"La anemia podr&#xed;a relacionarse con producci&#xf3;n eritrocitaria insuficiente.","children":[],"payload":{"tag":"li","lines":"176,177"}},{"content":"Es necesario distinguirla de anemia por sangrado o hem&#xf3;lisis.","children":[],"payload":{"tag":"li","lines":"177,179"}}],"payload":{"tag":"li","lines":"175,179"}},{"content":"\n<p data-lines=\"179,180\"><strong>Dato del caso: plaquetas de 35 000</strong></p>","children":[{"content":"La trombocitopenia podr&#xed;a deberse a megacariopoyesis ineficaz.","children":[],"payload":{"tag":"li","lines":"180,181"}},{"content":"No est&#xe1; demostrado que exista alteraci&#xf3;n de producci&#xf3;n.","children":[],"payload":{"tag":"li","lines":"181,183"}}],"payload":{"tag":"li","lines":"179,183"}},{"content":"\n<p data-lines=\"183,184\"><strong>Dato del caso: leucocitos de 4 100 y f&#xf3;rmula diferencial reportada</strong></p>","children":[{"content":"La f&#xf3;rmula leucocitaria requiere revisi&#xf3;n.","children":[],"payload":{"tag":"li","lines":"184,185"}},{"content":"Algunas enfermedades medulares producen alteraciones de maduraci&#xf3;n granuloc&#xed;tica.","children":[],"payload":{"tag":"li","lines":"185,186"}},{"content":"<strong>No se puede afirmar displasia a partir de estos porcentajes.</strong>","children":[],"payload":{"tag":"li","lines":"186,188"}}],"payload":{"tag":"li","lines":"183,188"}},{"content":"\n<p data-lines=\"188,189\"><strong>Dato del caso: paciente de 70 a&#xf1;os</strong></p>","children":[{"content":"La edad es un elemento de contexto para considerar enfermedades medulares.","children":[],"payload":{"tag":"li","lines":"189,190"}},{"content":"No es evidencia diagn&#xf3;stica por s&#xed; misma.","children":[],"payload":{"tag":"li","lines":"190,192"}}],"payload":{"tag":"li","lines":"188,192"}},{"content":"\n<p data-lines=\"192,193\"><strong>Dato del caso: sin blastos perif&#xe9;ricos reportados</strong></p>","children":[{"content":"No descarta s&#xed;ndrome mielodispl&#xe1;sico.","children":[],"payload":{"tag":"li","lines":"193,194"}},{"content":"La evaluaci&#xf3;n de la m&#xe9;dula &#xf3;sea puede revelar alteraciones no visibles en sangre perif&#xe9;rica.","children":[],"payload":{"tag":"li","lines":"194,196"}}],"payload":{"tag":"li","lines":"192,196"}},{"content":"\n<p data-lines=\"196,197\"><strong>LIMITACI&#xd3;N DE LA HIP&#xd3;TESIS</strong></p>","children":[{"content":"No explica directamente el complemento disminuido.","children":[],"payload":{"tag":"li","lines":"197,198"}},{"content":"No explica autom&#xe1;ticamente la IgG disminuida.","children":[],"payload":{"tag":"li","lines":"198,199"}},{"content":"Tampoco demuestra una causa para sangre ++ y prote&#xed;nas + en orina.","children":[],"payload":{"tag":"li","lines":"199,200"}},{"content":"Podr&#xed;an coexistir procesos independientes.","children":[],"payload":{"tag":"li","lines":"200,202"}}],"payload":{"tag":"li","lines":"196,202"}}],"payload":{"tag":"h4","lines":"173,174"}},{"content":"<strong>&#xbf;QU&#xc9; PRUEBAS SOLICITAR&#xcd;A?</strong>","children":[{"content":"\n<p data-lines=\"204,205\"><strong>Biometr&#xed;a hem&#xe1;tica repetida</strong></p>","children":[{"content":"Confirmar y caracterizar las citopenias.","children":[],"payload":{"tag":"li","lines":"205,207"}}],"payload":{"tag":"li","lines":"204,207"}},{"content":"\n<p data-lines=\"207,208\"><strong>Frotis de sangre perif&#xe9;rica</strong></p>","children":[{"content":"Buscar alteraciones morfol&#xf3;gicas.","children":[],"payload":{"tag":"li","lines":"208,209"}},{"content":"Evaluar caracter&#xed;sticas de eritrocitos, leucocitos y plaquetas.","children":[],"payload":{"tag":"li","lines":"209,211"}}],"payload":{"tag":"li","lines":"207,211"}},{"content":"\n<p data-lines=\"211,212\"><strong>Recuento de reticulocitos</strong></p>","children":[{"content":"Investigar si la respuesta de producci&#xf3;n eritrocitaria es adecuada.","children":[],"payload":{"tag":"li","lines":"212,214"}}],"payload":{"tag":"li","lines":"211,214"}},{"content":"\n<p data-lines=\"214,215\"><strong>Estudios para excluir otras causas</strong></p>","children":[{"content":"Hierro y ferritina.","children":[],"payload":{"tag":"li","lines":"215,216"}},{"content":"Vitamina B12.","children":[],"payload":{"tag":"li","lines":"216,217"}},{"content":"Folato.","children":[],"payload":{"tag":"li","lines":"217,218"}},{"content":"Marcadores de hem&#xf3;lisis seg&#xfa;n el contexto.","children":[],"payload":{"tag":"li","lines":"218,220"}}],"payload":{"tag":"li","lines":"214,220"}},{"content":"\n<p data-lines=\"220,221\"><strong>Aspirado de m&#xe9;dula &#xf3;sea</strong></p>","children":[{"content":"Evaluar morfolog&#xed;a y maduraci&#xf3;n de las l&#xed;neas hematopoy&#xe9;ticas.","children":[],"payload":{"tag":"li","lines":"221,223"}}],"payload":{"tag":"li","lines":"220,223"}},{"content":"\n<p data-lines=\"223,224\"><strong>Biopsia de m&#xe9;dula &#xf3;sea</strong></p>","children":[{"content":"Evaluar celularidad, arquitectura y posibles alteraciones.","children":[],"payload":{"tag":"li","lines":"224,226"}}],"payload":{"tag":"li","lines":"223,226"}},{"content":"\n<p data-lines=\"226,227\"><strong>Citogen&#xe9;tica y estudios moleculares</strong></p>","children":[{"content":"Investigar anomal&#xed;as clonales relevantes.","children":[],"payload":{"tag":"li","lines":"227,230"}}],"payload":{"tag":"li","lines":"226,230"}}],"payload":{"tag":"h4","lines":"202,203"}},{"content":"<strong>&#xbf;QU&#xc9; RESULTADOS LO APOYAR&#xcd;AN O DEBILITAR&#xcd;AN?</strong>","children":[{"content":"\n<p data-lines=\"232,233\"><strong>APOYAR&#xcd;AN LA HIP&#xd3;TESIS</strong></p>","children":[{"content":"Citopenias persistentes sin otra causa suficiente.","children":[],"payload":{"tag":"li","lines":"233,234"}},{"content":"Alteraciones morfol&#xf3;gicas compatibles con displasia.","children":[],"payload":{"tag":"li","lines":"234,235"}},{"content":"Hematopoyesis ineficaz.","children":[],"payload":{"tag":"li","lines":"235,236"}},{"content":"Alteraciones citogen&#xe9;ticas o moleculares compatibles.","children":[],"payload":{"tag":"li","lines":"236,237"}},{"content":"Evaluaci&#xf3;n medular que cumpla criterios diagn&#xf3;sticos.","children":[],"payload":{"tag":"li","lines":"237,239"}}],"payload":{"tag":"li","lines":"232,239"}},{"content":"\n<p data-lines=\"239,240\"><strong>LA DEBILITAR&#xcd;AN</strong></p>","children":[{"content":"M&#xe9;dula &#xf3;sea sin alteraciones diagn&#xf3;sticas.","children":[],"payload":{"tag":"li","lines":"240,241"}},{"content":"Evidencia clara de destrucci&#xf3;n perif&#xe9;rica de c&#xe9;lulas sangu&#xed;neas.","children":[],"payload":{"tag":"li","lines":"241,242"}},{"content":"Evidencia de consumo microvascular.","children":[],"payload":{"tag":"li","lines":"242,243"}},{"content":"Otra causa identificada que explique adecuadamente las citopenias.","children":[],"payload":{"tag":"li","lines":"243,245"}}],"payload":{"tag":"li","lines":"239,245"}},{"content":"\n<p data-lines=\"245,246\"><strong>CONCLUSI&#xd3;N</strong></p>","children":[{"content":"<strong>El SMD podr&#xed;a explicar anemia y trombocitopenia mediante producci&#xf3;n ineficaz.</strong>","children":[],"payload":{"tag":"li","lines":"246,247"}},{"content":"No permite explicar por s&#xed; solo todos los hallazgos inmunol&#xf3;gicos y urinarios.","children":[],"payload":{"tag":"li","lines":"247,248"}},{"content":"Requiere evaluaci&#xf3;n hematol&#xf3;gica y medular para confirmarse.","children":[],"payload":{"tag":"li","lines":"248,250"}}],"payload":{"tag":"li","lines":"245,250"}}],"payload":{"tag":"h4","lines":"230,231"}}],"payload":{"tag":"h3","lines":"171,172"}},{"content":"<strong>HIP&#xd3;TESIS 3. S&#xcd;NDROME HEMOL&#xcd;TICO UR&#xc9;MICO MEDIADO POR COMPLEMENTO (SHU-C)</strong>","children":[{"content":"<strong>&#xbf;POR QU&#xc9;?</strong>","children":[{"content":"\n<p data-lines=\"256,257\"><strong>Dato del caso: plaquetas de 35 000</strong></p>","children":[{"content":"La trombocitopenia podr&#xed;a deberse a consumo plaquetario en microtrombos.","children":[],"payload":{"tag":"li","lines":"257,258"}},{"content":"<strong>No hay microtrombos demostrados.</strong>","children":[],"payload":{"tag":"li","lines":"258,260"}}],"payload":{"tag":"li","lines":"256,260"}},{"content":"\n<p data-lines=\"260,261\"><strong>Dato del caso: hemoglobina de 6 g/dL</strong></p>","children":[{"content":"Una microangiopat&#xed;a puede producir hem&#xf3;lisis por fragmentaci&#xf3;n eritrocitaria.","children":[],"payload":{"tag":"li","lines":"261,262"}},{"content":"<strong>Pero la paciente no tiene hem&#xf3;lisis documentada.</strong>","children":[],"payload":{"tag":"li","lines":"262,263"}},{"content":"El sangrado es otra explicaci&#xf3;n posible.","children":[],"payload":{"tag":"li","lines":"263,265"}}],"payload":{"tag":"li","lines":"260,265"}},{"content":"\n<p data-lines=\"265,266\"><strong>Dato del caso: complemento disminuido</strong></p>","children":[{"content":"La desregulaci&#xf3;n del complemento participa en el SHU-C.","children":[],"payload":{"tag":"li","lines":"266,267"}},{"content":"<strong>El complemento bajo es inespec&#xed;fico.</strong>","children":[],"payload":{"tag":"li","lines":"267,268"}},{"content":"Los niveles de C3 y C4 pueden ser normales en SHU-C.","children":[],"payload":{"tag":"li","lines":"268,270"}}],"payload":{"tag":"li","lines":"265,270"}},{"content":"\n<p data-lines=\"270,271\"><strong>Dato del caso: sangre ++ y prote&#xed;nas + en orina</strong></p>","children":[{"content":"Motivan investigar posible afectaci&#xf3;n renal.","children":[],"payload":{"tag":"li","lines":"271,272"}},{"content":"Las microangiopat&#xed;as tromb&#xf3;ticas pueden afectar la microcirculaci&#xf3;n glomerular.","children":[],"payload":{"tag":"li","lines":"272,273"}},{"content":"<strong>No se ha demostrado lesi&#xf3;n renal aguda ni hematuria glomerular.</strong>","children":[],"payload":{"tag":"li","lines":"273,275"}}],"payload":{"tag":"li","lines":"270,275"}},{"content":"\n<p data-lines=\"275,276\"><strong>LIMITACIONES DE LA HIP&#xd3;TESIS</strong></p>","children":[{"content":"No se reportan esquistocitos.","children":[],"payload":{"tag":"li","lines":"276,277"}},{"content":"No se reportan marcadores de hem&#xf3;lisis.","children":[],"payload":{"tag":"li","lines":"277,278"}},{"content":"No se reporta creatinina.","children":[],"payload":{"tag":"li","lines":"278,279"}},{"content":"No existe evidencia suficiente para confirmar una microangiopat&#xed;a tromb&#xf3;tica.","children":[],"payload":{"tag":"li","lines":"279,280"}},{"content":"La IgG baja no es una caracter&#xed;stica diagn&#xf3;stica del SHU-C.","children":[],"payload":{"tag":"li","lines":"280,282"}}],"payload":{"tag":"li","lines":"275,282"}}],"payload":{"tag":"h4","lines":"254,255"}},{"content":"<strong>&#xbf;QU&#xc9; PRUEBAS SOLICITAR&#xcd;A?</strong>","children":[{"content":"\n<p data-lines=\"284,285\"><strong>Frotis de sangre perif&#xe9;rica</strong></p>","children":[{"content":"Buscar esquistocitos.","children":[],"payload":{"tag":"li","lines":"285,286"}},{"content":"Investigar fragmentaci&#xf3;n eritrocitaria.","children":[],"payload":{"tag":"li","lines":"286,288"}}],"payload":{"tag":"li","lines":"284,288"}},{"content":"\n<p data-lines=\"288,289\"><strong>LDH</strong></p>","children":[{"content":"Investigar lesi&#xf3;n celular y hem&#xf3;lisis.","children":[],"payload":{"tag":"li","lines":"289,291"}}],"payload":{"tag":"li","lines":"288,291"}},{"content":"\n<p data-lines=\"291,292\"><strong>Haptoglobina</strong></p>","children":[{"content":"Investigar consumo asociado a hem&#xf3;lisis intravascular.","children":[],"payload":{"tag":"li","lines":"292,294"}}],"payload":{"tag":"li","lines":"291,294"}},{"content":"\n<p data-lines=\"294,295\"><strong>Bilirrubina indirecta y reticulocitos</strong></p>","children":[{"content":"Buscar datos de destrucci&#xf3;n eritrocitaria y respuesta medular.","children":[],"payload":{"tag":"li","lines":"295,297"}}],"payload":{"tag":"li","lines":"294,297"}},{"content":"\n<p data-lines=\"297,298\"><strong>Coombs directo</strong></p>","children":[{"content":"Ayudar a distinguir hem&#xf3;lisis inmune de otros mecanismos.","children":[],"payload":{"tag":"li","lines":"298,300"}}],"payload":{"tag":"li","lines":"297,300"}},{"content":"\n<p data-lines=\"300,301\"><strong>Creatinina y filtraci&#xf3;n glomerular estimada</strong></p>","children":[{"content":"Evaluar posible lesi&#xf3;n renal.","children":[],"payload":{"tag":"li","lines":"301,303"}}],"payload":{"tag":"li","lines":"300,303"}},{"content":"\n<p data-lines=\"303,304\"><strong>Sedimento urinario y cuantificaci&#xf3;n de proteinuria</strong></p>","children":[{"content":"Caracterizar las alteraciones urinarias.","children":[],"payload":{"tag":"li","lines":"304,306"}}],"payload":{"tag":"li","lines":"303,306"}},{"content":"\n<p data-lines=\"306,307\"><strong>Actividad de ADAMTS13</strong></p>","children":[{"content":"Investigar PTT como diagn&#xf3;stico alternativo fundamental.","children":[],"payload":{"tag":"li","lines":"307,308"}},{"content":"Una actividad gravemente reducida, t&#xed;picamente menor de 10 %, apoyar&#xed;a PTT.","children":[],"payload":{"tag":"li","lines":"308,310"}}],"payload":{"tag":"li","lines":"306,310"}},{"content":"\n<p data-lines=\"310,311\"><strong>C3 y C4</strong></p>","children":[{"content":"Caracterizar la alteraci&#xf3;n del complemento.","children":[],"payload":{"tag":"li","lines":"311,312"}},{"content":"Un resultado normal no excluye SHU-C.","children":[],"payload":{"tag":"li","lines":"312,314"}}],"payload":{"tag":"li","lines":"310,314"}},{"content":"\n<p data-lines=\"314,315\"><strong>Estudios espec&#xed;ficos del complemento</strong></p>","children":[{"content":"Evaluar regulaci&#xf3;n y posibles alteraciones del sistema, cuando corresponda.","children":[],"payload":{"tag":"li","lines":"315,317"}}],"payload":{"tag":"li","lines":"314,317"}},{"content":"\n<p data-lines=\"317,318\"><strong>Pruebas para excluir otras microangiopat&#xed;as</strong></p>","children":[{"content":"TP, TTPa y fibrin&#xf3;geno.","children":[],"payload":{"tag":"li","lines":"318,319"}},{"content":"Evaluaci&#xf3;n de causas infecciosas y secundarias seg&#xfa;n el contexto.","children":[],"payload":{"tag":"li","lines":"319,320"}},{"content":"Investigaci&#xf3;n de toxina Shiga si la presentaci&#xf3;n cl&#xed;nica lo justifica.","children":[],"payload":{"tag":"li","lines":"320,322"}}],"payload":{"tag":"li","lines":"317,322"}}],"payload":{"tag":"h4","lines":"282,283"}},{"content":"<strong>&#xbf;QU&#xc9; RESULTADOS LO APOYAR&#xcd;AN O DEBILITAR&#xcd;AN?</strong>","children":[{"content":"\n<p data-lines=\"324,325\"><strong>APOYAR&#xcd;AN LA HIP&#xd3;TESIS</strong></p>","children":[{"content":"Evidencia de anemia hemol&#xed;tica microangiop&#xe1;tica.","children":[],"payload":{"tag":"li","lines":"325,326"}},{"content":"Esquistocitos en frotis.","children":[],"payload":{"tag":"li","lines":"326,327"}},{"content":"LDH elevada y haptoglobina disminuida.","children":[],"payload":{"tag":"li","lines":"327,328"}},{"content":"Trombocitopenia asociada con microangiopat&#xed;a.","children":[],"payload":{"tag":"li","lines":"328,329"}},{"content":"Evidencia de lesi&#xf3;n renal.","children":[],"payload":{"tag":"li","lines":"329,330"}},{"content":"Evaluaci&#xf3;n compatible con SHU-C despu&#xe9;s de investigar otras causas.","children":[],"payload":{"tag":"li","lines":"330,331"}},{"content":"Hallazgos relevantes de alteraci&#xf3;n del complemento, cuando est&#xe9;n presentes.","children":[],"payload":{"tag":"li","lines":"331,333"}}],"payload":{"tag":"li","lines":"324,333"}},{"content":"\n<p data-lines=\"333,334\"><strong>LA DEBILITAR&#xcd;AN</strong></p>","children":[{"content":"Ausencia persistente de evidencia de hem&#xf3;lisis microangiop&#xe1;tica.","children":[],"payload":{"tag":"li","lines":"334,335"}},{"content":"Funci&#xf3;n renal sin alteraciones relevantes, aunque esto no excluye todas las presentaciones.","children":[],"payload":{"tag":"li","lines":"335,336"}},{"content":"Una explicaci&#xf3;n alternativa m&#xe1;s s&#xf3;lida para anemia y trombocitopenia.","children":[],"payload":{"tag":"li","lines":"336,338"}}],"payload":{"tag":"li","lines":"333,338"}},{"content":"\n<p data-lines=\"338,339\"><strong>RESULTADO QUE ORIENTAR&#xcd;A A OTRA ENFERMEDAD</strong></p>","children":[{"content":"ADAMTS13 gravemente disminuido, t&#xed;picamente menor de 10 %.","children":[{"content":"Favorecer&#xed;a PTT en lugar de SHU-C.","children":[],"payload":{"tag":"li","lines":"340,341"}},{"content":"Ambas pertenecen al grupo de microangiopat&#xed;as tromb&#xf3;ticas.","children":[],"payload":{"tag":"li","lines":"341,343"}}],"payload":{"tag":"li","lines":"339,343"}}],"payload":{"tag":"li","lines":"338,343"}},{"content":"\n<p data-lines=\"343,344\"><strong>CONCLUSI&#xd3;N</strong></p>","children":[{"content":"<strong>El SHU-C podr&#xed;a relacionar trombocitopenia, anemia y posible afectaci&#xf3;n renal.</strong>","children":[],"payload":{"tag":"li","lines":"344,345"}},{"content":"Sin embargo, falta demostrar el mecanismo central: microangiopat&#xed;a tromb&#xf3;tica con hem&#xf3;lisis.","children":[],"payload":{"tag":"li","lines":"345,346"}},{"content":"El complemento bajo por s&#xed; solo no confirma este diagn&#xf3;stico.","children":[],"payload":{"tag":"li","lines":"346,348"}}],"payload":{"tag":"li","lines":"343,348"}}],"payload":{"tag":"h4","lines":"322,323"}}],"payload":{"tag":"h3","lines":"252,253"}}],"payload":{"tag":"h2","lines":"87,88"}},{"content":"<strong>P4. MECANISMO CAUSAL PASO A PASO</strong>","children":[{"content":"<strong>1. PROCESO CELULAR INICIAL</strong>","children":[{"content":"<strong>P&#xe9;rdida de tolerancia inmunol&#xf3;gica</strong>","children":[{"content":"Activaci&#xf3;n de linfocitos B autorreactivos.","children":[{"content":"Producci&#xf3;n de autoanticuerpos.","children":[{"content":"Posible da&#xf1;o a c&#xe9;lulas sangu&#xed;neas y glom&#xe9;rulos.","children":[],"payload":{"tag":"li","lines":"356,358"}}],"payload":{"tag":"li","lines":"355,358"}}],"payload":{"tag":"li","lines":"354,358"}}],"payload":{"tag":"li","lines":"353,358"}}],"payload":{"tag":"h3","lines":"352,353"}},{"content":"<strong>2. SISTEMA HEMATOL&#xd3;GICO</strong>","children":[{"content":"<strong>Persona sana:</strong> las plaquetas participan en la coagulaci&#xf3;n y los eritrocitos transportan ox&#xed;geno.","children":[],"payload":{"tag":"li","lines":"359,360"}},{"content":"<strong>Posible mecanismo alterado</strong>","children":[{"content":"Autoanticuerpos contra plaquetas.","children":[{"content":"Eliminaci&#xf3;n por macr&#xf3;fagos.","children":[{"content":"Disminuci&#xf3;n de plaquetas.","children":[{"content":"Alteraci&#xf3;n de la hemostasia.","children":[{"content":"<strong>Manifestaci&#xf3;n observada: sangrado y plaquetas de 35 000.</strong>","children":[],"payload":{"tag":"li","lines":"365,366"}}],"payload":{"tag":"li","lines":"364,366"}}],"payload":{"tag":"li","lines":"363,366"}}],"payload":{"tag":"li","lines":"362,366"}}],"payload":{"tag":"li","lines":"361,366"}}],"payload":{"tag":"li","lines":"360,366"}},{"content":"<strong>Consecuencia adicional posible</strong>","children":[{"content":"Sangrado.","children":[{"content":"P&#xe9;rdida de eritrocitos.","children":[{"content":"Disminuci&#xf3;n de hemoglobina.","children":[{"content":"<strong>Manifestaci&#xf3;n observada: Hb de 6 g/dL.</strong>","children":[],"payload":{"tag":"li","lines":"370,371"}}],"payload":{"tag":"li","lines":"369,371"}}],"payload":{"tag":"li","lines":"368,371"}}],"payload":{"tag":"li","lines":"367,371"}}],"payload":{"tag":"li","lines":"366,371"}},{"content":"<strong>Importante:</strong> no se ha demostrado que las plaquetas disminuyeran por autoinmunidad ni que el sangrado explique toda la anemia.","children":[],"payload":{"tag":"li","lines":"371,373"}}],"payload":{"tag":"h3","lines":"358,359"}},{"content":"<strong>3. SISTEMA RENAL</strong>","children":[{"content":"<strong>Persona sana:</strong> la barrera glomerular impide el paso significativo de eritrocitos y prote&#xed;nas.","children":[],"payload":{"tag":"li","lines":"374,375"}},{"content":"<strong>Posible mecanismo alterado</strong>","children":[{"content":"Autoanticuerpos.","children":[{"content":"Formaci&#xf3;n de inmunocomplejos.","children":[{"content":"Activaci&#xf3;n del complemento.","children":[{"content":"Inflamaci&#xf3;n y posible lesi&#xf3;n glomerular.","children":[{"content":"Alteraci&#xf3;n de la barrera de filtraci&#xf3;n.","children":[{"content":"<strong>Hallazgos observados: sangre ++ y prote&#xed;nas + en orina.</strong>","children":[],"payload":{"tag":"li","lines":"381,383"}}],"payload":{"tag":"li","lines":"380,383"}}],"payload":{"tag":"li","lines":"379,383"}}],"payload":{"tag":"li","lines":"378,383"}}],"payload":{"tag":"li","lines":"377,383"}}],"payload":{"tag":"li","lines":"376,383"}}],"payload":{"tag":"li","lines":"375,383"}}],"payload":{"tag":"h3","lines":"373,374"}}],"payload":{"tag":"h2","lines":"350,351"}},{"content":"<strong>REFERENCIAS BIBLIOGR&#xc1;FICAS</strong>","children":[{"content":"\n<p data-lines=\"385,386\"><strong>Su, X., Yu, H., Lei, Q., Chen, X., Tong, Y., Zhang, Z., Yang, W., Guo, Y., &amp; Lin, L. (2024).</strong> Systemic lupus erythematosus: Pathogenesis and targeted therapy. Molecular Biomedicine, 5, Article 54. <a href=\"https://doi.org/10.1186/s43556-024-00217-8\">DOI</a>.</p>","children":[],"payload":{"tag":"li","lines":"385,387"}},{"content":"\n<p data-lines=\"387,388\"><strong>Thompson, G. L., &amp; Kavanagh, D. (2022).</strong> Diagnosis and treatment of thrombotic microangiopathy. International Journal of Laboratory Hematology, 44(S1), 101&#x2013;113. <a href=\"https://doi.org/10.1111/ijlh.13954\">DOI</a>.</p>","childr
